[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holotwin"
version = "1.0.0"
description = "Differentiable digital twin for Fraunhofer holographic optical systems (CITL calibration + CGH)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "opencv-python",
    "pytorch-msssim",
    "tqdm",
    "python-dotenv"
]

# Optional extras.
#
# vendor: Python packages for the hardware drivers in src/hardware/.
#   - Thorlabs Kiralux camera (camera_thor/camera_cs126mu.py) uses pylablib,
#     which also needs Thorlabs' camera software (ThorCam) installed.
#   - The Santec SLM (slm_santec/slm.py) has no PyPI package: copy _slm_win.py,
#     SLMFunc.dll and FTD3XX.dll from the Santec SDK into src/hardware/slm_santec/.
#   Not needed for simulation, training or CGH (src/twin, src/training,
#   src/cgh, src/loss).
#   Install with: python -m pip install -e ".[vendor]"
#
# mac: cairosvg for loading SVG targets on macOS (Windows uses Inkscape).

[project.optional-dependencies]
vendor = [
    "pylablib"
]

mac = [
    "cairosvg"
]

# The import style is `from src.twin.model import ...`, i.e. `src` itself
# is the package name (this repo isn't using the nested src/<pkgname>/
# layout). This just tells setuptools to package `src` and everything
# under it as-is, so `pip install -e .` exposes exactly the right import paths.
[tool.setuptools.packages.find]
include = ["src*"]